# 検証を機械で回す。
#
# ここに置いていない検査は「やったことがある」だけで、いずれ静かに腐る。
# 実際 S2 では、型チェックを一度も掛けていなかったことが後から見つかった。
#
# ollama は CI に無いので、ここで回るのは生成を伴わない検査だけ。
# 実モデルでの計測は手元で行う（README の「開発」参照）。
#
# **path フィルタは否定形で書く。** 肯定形で「境界に関係するファイル」を列挙すると、
# 境界の定義を CI 設定と実装の 2 箇所に持つことになり、新しいファイルを足したときに
# フィルタから漏れて **ubuntu だけが緑で通る**。否定形なら列挙の腐敗が原理的に消える。
# `.github/**` を除外リストに入れないのは、**ワークフロー自身の変更こそ
# 境界の検査を無効化しうる変更**（フィルタを緩める・ジョブを消す）だから。
name: checks

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'LICENSE']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: uv を入れる
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 依存を同期する
        run: uv sync --all-extras --dev

      - name: lint
        run: uv run ruff check src tests tools

      - name: 整形の確認
        run: uv run ruff format --check src tests tools

      - name: 型
        run: uv run mypy

      # 境界テストは macOS ジョブで回る。ここで回すと全部 skip され、
      # 「緑だが一度も走っていない」状態になる。
      #
      # **カバレッジの対象から sandbox/ を外す。** ここで測ると、境界テストを
      # 外したぶんだけ数字が下がり、**下限を下げる圧力**になる。境界のカバレッジは
      # macOS ジョブが同じ 90% で測るので、どちらの穴も塞がったままになる。
      - name: テストとカバレッジ
        run: >
          uv run pytest -q --deselect tests/test_sandbox.py
          --cov=src/quirkbench --cov-report=term --cov-fail-under=90
          --cov-config=.coveragerc-checks

      # カバレッジは「その行を通ったか」しか見ない。ガードが実際に呼ばれて
      # いるかは別に測る。全部落ちるのが正常で、生き残りが出たら失敗させる。
      - name: ミューテーション
        run: uv run python tools/mutate.py

      # **ワークフロー自身にステップの重複が無いこと。** 編集が複製すると、
      # 古い版と新しい版が両方回り、古い版だけが落ちる。ログには古い版の
      # 中身が出るので「直したはずのものが直っていない」に見える（実際に踏んだ）。
      - name: ワークフローにステップの重複が無いこと
        run: uv run python tools/check-workflow.py

      # ケースの粒度規約を機械で強制する。規約は書いた時点では効かない。
      - name: ケースのゲート
        run: uv run qb lint-cases

      # **README が順位表になっていないこと。** プロファイル表を載せる以上、
      # 見た目は順位表に近づく。散文で「順位表ではない」と書いても、
      # **合計欄が 1 つあれば読み手はそこで並べ替える。**
      # run データはリポジトリに入らないので、ここで回るのは欄の検査だけ。
      - name: README の表に合計欄が無いこと
        run: uv run python tools/check-readme.py

      # **除外は 1 箇所に書けば効くものではない。** 読み手が最初に見る場所が
      # 人によって違うので、4 箇所すべてに書かれていることを機械で見る
      - name: assets が MIT の対象外だと 4 箇所に書かれていること
        run: uv run python tools/check-brand-license.py

      # **変異検査のあとにソースが元どおりか。** git だけでは足りない —
      # バイト数の変わらない変異は `.pyc` に残り、ソースは正しいのに
      # **実行だけが違う**状態を作る（§15.5a で実際に踏んだ）。
      - name: 変異検査がソースもバイトコードも戻していること
        run: |
          git diff --exit-code -- src tools
          uv run python tools/check-bytecode.py

      # レポートは ollama が要らない（生成済みの JSONL しか読まない）ので
      # ここで回せる。**表が壊れても pytest だけでは気づけない** —
      # 集計は通るがレンダリングで落ちる形の欠陥を、実際に叩いて捕まえる。
      - name: レポートが生成できること
        run: |
          uv run python - <<'EOF'
          import json, pathlib
          run = pathlib.Path("runs/ci")
          run.mkdir(parents=True, exist_ok=True)
          base = {
              "ollama_version": "0.0.0", "case_id": "instruct-json-profile-en",
              "seed": 1000, "done_reason": "stop", "eval_count": 10,
              "eval_duration_ns": 10**8, "prompt_eval_count": 5,
              "prompt_eval_duration_ns": 10**7, "load_duration_ns": 10**6,
              "wall_seconds": 0.1,
          }
          # 2 モデルで差を付ける。差が無いと識別力なしになり、
          # z を出す経路が一度も通らない
          #
          # **問題の種類が 2 つ要る。** 1 種類だと 1 件抜きで次元が消えるので、
          # `qb stability` の jackknife の経路が CI で一度も通らない。
          # **抜く単位は task なので、ja/en の対訳を足しても種類は増えない**（§17.1）
          ok = '{"name": "Ichiro Tanaka", "age": 42, "occupation": "welder"}'
          tags_ok = '{"category": "technology", "tags": ["water", "island", "cost"],'
          tags_ok += ' "is_opinion": false}'
          rows = [
              {**base, "gen_id": "g0", "model": "m-a", "model_digest": "d-a",
               "response": ok},
              {**base, "gen_id": "g1", "model": "m-b", "model_digest": "d-b",
               "response": "not json at all"},
              # 2 種類目（task: tags）。**勝敗を逆にする** — 揃えると幅が 0 になり、
              # jackknife が動いていなくても同じ表が出る
              {**base, "gen_id": "g2", "model": "m-a", "model_digest": "d-a",
               "case_id": "instruct-tags-en", "response": "not json at all"},
              {**base, "gen_id": "g3", "model": "m-b", "model_digest": "d-b",
               "case_id": "instruct-tags-en", "response": tags_ok},
          ]
          (run / "generations.jsonl").write_text(
              "\n".join(json.dumps(r) for r in rows) + "\n", encoding="utf-8")
          EOF
          uv run qb score --run ci --dims instruct
          uv run qb report --run ci
          test -s reports/ci/report.md
          test -s reports/ci/compare.md
          grep -q "次元プロファイル" reports/ci/report.md
          uv run qb stability --run ci
          test -s reports/ci/stability.md
          # **ケースが食い違う組で作ってある**ので、1 件抜きの経路を通れば
          # 必ず 0 をまたぐ印が表に出る。出なければ jackknife が動いていない
          grep -q "独立な観測" reports/ci/stability.md
          grep -qE '^\|.*\?[[:space:]]*\|$' reports/ci/stability.md

      # src が tests を import していないこと。stub 実行器が本番の import 経路から
      # 到達できると、**サンドボックスを通さない実行**が 1 行で作れてしまう。
      - name: stub がテスト側に閉じていること
        run: |
          if grep -rn "^\s*\(from\|import\)\s\+tests" src/quirkbench/; then
            echo "src が tests を import している" >&2
            exit 1
          fi
          echo "OK"

  sandbox:
    # **この体系で唯一の実質的なセキュリティ境界**を実機で測る。
    # macOS は Linux の約 10 倍のコスト（$0.062/分 対 $0.006/分）なので、
    # 回る条件は上の paths-ignore で絞っている。超えたらフィルタを緩めるのではなく
    # このジョブの中身を削る — 緩めると、削ったことが緑の中に隠れる。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: uv を入れる
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 依存を同期する
        run: uv sync --all-extras --dev

      # カナリアが「対象が存在しないだけ」で合格しないことを、
      # 境界を外した対照実験まで含めて確かめる。
      # sandbox/ と gate.py のカバレッジも 90% を要求する。ubuntu 側で外した分を
      # ここで取り返さないと、**境界だけ検査が緩い**状態になる。
      #
      # 範囲は .coveragerc-sandbox で指定する。`--cov=src/quirkbench/gate` と書くと
      # coverage がパッケージ名として解決に失敗し、**警告を出して静かに対象から外れる**。
      # 実際 CI は緑のまま gate.py を一度も測っていなかった（入れたら 90% を割った）。
      - name: 境界テストとカバレッジ
        run: >
          uv run pytest -q tests/test_sandbox.py tests/test_gate.py
          --cov --cov-config=.coveragerc-sandbox
          --cov-report=term --cov-fail-under=90

      # 境界のガードは tools/mutate.py の通常セットでは届かない。
      # canary_passed を True に固定する変異などをここで殺す。
      - name: 境界のミューテーション
        run: uv run python tools/mutate.py --boundary
