  language: en
  count: {n: 5, pattern: numbered_list}
  min_tokens: 10

score:
  kind: ideate
  count: {n: 5, pattern: numbered_list}
  topic: the name of a small 12-seat cafe in a residential neighbourhood
  coverage_terms:
