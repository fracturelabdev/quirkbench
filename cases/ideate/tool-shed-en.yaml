# ideate 次元 — 4 つ目のタスクの対訳。
# `coffee-shop` は命名、`bookstore` は施策、`questions` は疑問文。
# こちらは規則（義務・禁止の文）。短い固有名詞は足さない。
# 命名課題の脱線ゲートは順序が逆転しており、同じ型を足しても分離できない。
# 難度は手元のモデルで未測定。
# 当たり語は部分一致。`back` 単体は backup / background / in the back に当たる。
# `give back` も give background の先頭になるので、後ろに語を足した句だけを置く。
# `give it back.` のように末尾のピリオドまで含めると、`Bring it back tomorrow.` が漏れる。
# 文末はピリオド、続きがある形は空白で止める。
# `damage` は undamaged に、`broken` は unbroken に含まれる。
# `Return every tool unbroken.` のような返却の文が、破損の軸に当たってしまう。
# 否定の un が付いた語の中に埋まらない句だけを置く。
# `reserve` は preserve に、`replace` は irreplaceable に含まれるので置かない。
id: ideate-tool-shed-en
dim: ideate
lang: en
task: tool-shed
pair: ideate-tool-shed-ja

prompt: |
  Think of 5 rules for residents borrowing tools from a shared neighbourhood
  shed. Use a numbered list with one rule per line. No explanations.

options:
  num_predict: 300

failure:
  format: none
  language: en
  count: {n: 5, pattern: numbered_list}
  min_tokens: 10

score:
  kind: ideate
  count: {n: 5, pattern: numbered_list}
  topic: rules for residents borrowing tools from a shared neighbourhood shed
  coverage_terms:
    - [return, "give back the", "give back a", "give back all", "give back what", "give back your", "bring back the", "bring back a", "bring back all", "bring back what", "bring back your", "give it back ", "give it back.", "bring it back ", "bring it back.", "give them back ", "give them back.", "bring them back ", "bring them back."]
    - ["is damaged", "are damaged", "was damaged", "were damaged", "get damaged", "gets damaged", "any damage", "the damage", "damage to", "is broken", "are broken", "was broken", "were broken", "get broken", "gets broken", "a broken", "any broken", "if broken", repair, "replace the", "replace a", "replace it", "replace them", replaced, replacing, replacement]
    - [booking, schedule, queue]
