# code-fix 次元 — 上の ja 版の対訳
id: code-fix-median-en
dim: code-fix
lang: en
task: median
pair: code-fix-median-ja

prompt: |
  The function below has a bug. Output only the corrected function in Python.
  Write nothing but the code.

  def median(values: list[float]) -> float:
      """Return the median of values. If the count is even, return the mean of
      the middle two."""
      s = sorted(values)
      return s[len(s) // 2]

options:
  num_predict: 512

failure:
  format: python
  extract: fenced_or_whole
  language: none
  min_tokens: 20

score:
  kind: pytest
  entry_point: median
  timeout_seconds: 30
  test: |
    def check(candidate):
        assert candidate([3, 1, 2]) == 2
        assert candidate([4, 1, 3, 2]) == 2.5
        assert candidate([5]) == 5
  reference: |
    def median(values):
        s = sorted(values)
        mid = len(s) // 2
        if len(s) % 2:
            return s[mid]
        return (s[mid - 1] + s[mid]) / 2
