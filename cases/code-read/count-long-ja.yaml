# code-read 次元 — 3 つ目のタスク。
# `off-by-one` は平均の分母が 1 少ない。`accumulate` は `=` と `+=` の取り違え。
# こちらは「以上」を `>` で書いて、境界の 1 件を落とす。
# 誤りは比較の行だけにある。別の行を直しても契約は満たせない。
# 答えは 6。`accumulate` は 4、`off-by-one` は 5。
# 同じ数字を正解にすると、常にその数字を書くモデルが両方通る。
# バグ行の前に足した 2 行は説明で、比較の閾値を持たない。
# 難度は手元のモデルで未測定。行をまたがないと見えないバグは floor だったので、
# その形にはしていない。
id: code-read-count-long-ja
dim: code-read
lang: ja
task: count-long
pair: code-read-count-long-en

prompt: |
  次のコードには 1 行だけバグがあります。その行番号だけを出力してください。
  数字以外は書かないでください。

  count_at_least_three は、長さが 3 文字以上の単語を数えます。

  1: def count_at_least_three(words):
  2:     """words を順に見て、条件を満たす個数を返す。
  3:     words は文字列のリスト。"""
  4:     n = 0
  5:     for word in words:
  6:         if len(word) > 3:
  7:             n += 1
  8:     return n
  9:
  10: print(count_at_least_three(["owl", "to", "heron"]))

options:
  num_predict: 64

failure:
  format: none
  language: none
  min_tokens: 1

score:
  kind: exact
  match: equals
  expect: "6"
