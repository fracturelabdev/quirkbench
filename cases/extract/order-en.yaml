# extract 次元 — 2 つ目のタスク（FLB-QB-001 §17.5）。
# `vet` は人物、こちらは伝票。**数値のキーが 3 つある**ので、
# 文字列だけの抽出とは違う失敗の仕方が出る
id: extract-order-en
dim: extract
lang: en
task: order
pair: extract-order-ja

prompt: |
  Extract the information from the following sentence and output it as JSON.
  Output nothing but JSON. The keys are order_id, item, quantity, unit_price
  and city.

  "Order 4821 shipped 3 mugs at 780 yen each to Nagoya."

options:
  num_predict: 256

failure:
  format: json
  extract: fenced_or_first_object
  language: none
  min_tokens: 4

score:
  kind: json_keys
  expect:
    order_id: 4821
    item: mug
    quantity: 3
    unit_price: 780
    city: Nagoya
