# longctx 次元 — 2 つ目の文書。針は中央、先頭に別の符号を置く。
# `warehouse-*` は符号が 1 つで、変えているのは位置だけ。
# こちらは 1 行目が SPRUCE-91（第 8 診療所）、46 行目が PINECONE-19（第 3 診療所）。
# 問うのは第 3 診療所。最初に見た符号を答える失敗を、位置の失敗と分けて見る。
# 本文は 1 行ごとに内容を変える。同じ文の反復だと、符号の行だけが浮いて
# 位置ではなく見た目で拾える。長さは num_ctx の過半を使い、75% の上限は超えない。
# 対訳は置かない。同じ文字数の英語は実トークンが数分の一になり、言語差と文脈長が交絡する。
# 既存の warehouse も日本語だけである。難度は手元のモデルで未測定。
id: longctx-clinic-mid-ja
dim: longctx
lang: ja
task: clinic-mid

prompt: |
  次の記録を読み、質問に答えてください。答えだけを出力してください。

  1. 朝の引き継ぎの記録では、第 8 診療所の当直符号は SPRUCE-91 であると当直医が読み上げた。夜間に受けた連絡は在庫の確認だけで、急患の転送や臨時の出勤はなかった。担当の交代表は前日のまま張り出され、欠員の書き込みはない。
  2. 昼の休憩に入る直前、第 7 診療所では井上が翌日の血圧計の配置を廊下の棚に書き出し、優先して残した枠は 14 人分だった。開店直後の電話は処方内容の確認が主で、他施設の名称を尋ねる電話はなかった。薬品庫の鍵は当番が預かり、紛失を示すメモは残っていない。
  3. 午後の予約が埋まる頃、第 1 診療所の当直室では包帯の貸出表を原田が締め、未返却は 8 件だと記した。午後二時以降は予約どおり進み、臨時休診の連絡は出ていない。担当の交代は予定表どおりで、備考欄への追記はなかった。
  4. 夕方の引き継ぎの前、第 4 診療所では研修の見学者が西村の横で聴診器の扱いを見て、玄関ホールでの実施は 13 件だった。開店直後の患者は持病の経過観察が中心で、新たな集団感染は疑っていない。夜間照明の点検は終わり、切れている球は予備と交換してある。
  5. 夜の巡回が終わったあと、第 7 診療所では近藤が待合の血圧計を見て回り、翌週の補充を 7 箱と見積もった。待ち時間はおおむね 13 分で、受付への苦情は残っていない。近隣の薬局へ回した処方箋はすべて受領され、不着の連絡は来ていない。
  6. 深夜の見回りが済んだあと、第 1 診療所では包帯の滅菌予定を小林が組み、薬局で処理する分は 12 セットだった。来院者への説明は開店直後に集中し、説明漏れの報告はない。呼び出しの順番表は書き直してあり、飛ばした番号の苦情はない。
  7. 明け方の点検の直前、第 4 診療所の森は廊下の棚の床と聴診器を載せる台を点検し、修理が要る箇所は 6 か所だった。来院の流れは午後二時に厚く、途中で受け付けを止めた記録はない。呼び出しベルの電池は交換済みで、鳴らなかった件数はゼロだった。
  8. 早朝の申し送りのあと、第 7 診療所では村田が当直日誌に当直室の室温と血圧計の消費を書き、消費数は 11 だった。待ち人数は 10 人ほどで、大きな遅延は起きていない。食事の配膳は時間どおり終わり、食べ残しの件数は平常の範囲だった。
  9. 午前の外来が始まる前、第 1 診療所の玄関ホールに届いた包帯を加藤が開梱し、検品で除いた数は 5 個だった。配送は午後二時に終わり、納品書と現物の数は一致している。駐車場の誘導は地域のボランティアが行い、混乱の記録はない。
  10. 昼の休憩に入る直前、第 4 診療所の中村は聴診器を待合から診察室へ運び、破損は 10 個だけだったと書いた。開店直後の混雑は予定の範囲で、救急搬送の依頼はなかった。薬品庫の鍵は当番が預かり、紛失を示すメモは残っていない。
  11. 午後の予約が埋まる頃、第 7 診療所の藤田は薬局の掲示を直し、血圧計の在庫注意を 4 枚出した。待ち時間の目安は 22 分で、掲示した目安と実際の遅れに差は出ていない。担当の交代は予定表どおりで、備考欄への追記はなかった。
  12. 夕方の引き継ぎの前、第 1 診療所の廊下の棚で青木が包帯の残数の確認を行い、使える在庫は 9 個だと控えた。来院の山は開店直後にあり、転院を求める連絡は入っていない。夜間照明の点検は終わり、切れている球は予備と交換してある。
  13. 夜の巡回が終わったあと、第 4 診療所の当直室を斎藤が施錠前に確認し、聴診器の置き場がずれていた件数は 14 だった。午後二時の来院は落ち着き、近隣施設への応援要請はない。近隣の薬局へ回した処方箋はすべて受領され、不着の連絡は来ていない。
