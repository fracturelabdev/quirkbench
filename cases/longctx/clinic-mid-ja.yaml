# longctx 次元 — 2 つ目の文書。針は中央、先頭に別の符号を置く。
# `warehouse-*` は符号が 1 つで、変えているのは位置だけ。
# こちらは各行に別の符号がある。符号が 1 行目の SPRUCE-91 と
# 46 行目の PINECONE-19 だけだと、先頭の囮を除いた残りが正答になり、
# 中央を読まずに符号の走査で対応できる。
# 問うのは第 3 診療所の PINECONE-19。第 3 診療所への言及は先頭にも置くが、
# そこには正答の符号を書かない。最初に見た符号を答える失敗を、位置の失敗と分ける。
# 本文は 1 行ごとに内容を変える。同じ文の反復だと、符号の行だけが浮く。
# 長さは num_ctx の 65% から 75% に収める。
# 対訳は置かない。同じ文字数の英語は実トークンが数分の一になり、言語差と文脈長が交絡する。
# 既存の warehouse も日本語だけである。難度は手元のモデルで未測定。
id: longctx-clinic-mid-ja
dim: longctx
lang: ja
task: clinic-mid

