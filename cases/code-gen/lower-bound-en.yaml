# code-gen 次元 — 3 つ目のタスク。
# `two-sum` はハッシュ表、`balanced` はスタック。こちらはソート列の下限。
# **同じ解法で解けないものを選ぶ。** 線形走査でも二分探索でも、契約を満たせば通る。
# 難度は手元のモデルで未測定。floor / ceiling なら捨てる。
id: code-gen-lower-bound-en
dim: code-gen
lang: en
task: lower-bound
pair: code-gen-lower-bound-ja

prompt: |
  Implement the following function in Python. Write nothing but the code.

  def lower_bound(nums: list[int], target: int) -> int:
      """nums is sorted ascending. Return the index of the first element
      that is greater than or equal to target. If every element is smaller,
      return len(nums). Return 0 when nums is empty."""

options:
  num_predict: 512

failure:
  format: python
  extract: fenced_or_whole
  language: none
  min_tokens: 20

score:
  kind: pytest
  entry_point: lower_bound
  timeout_seconds: 30
  test: |
    def check(candidate):
        assert candidate([1, 3, 3, 5], 3) == 1
        assert candidate([1, 3, 5], 4) == 2
        assert candidate([1, 3, 5], 6) == 3
        assert candidate([2, 4], 1) == 0
        assert candidate([], 1) == 0
  reference: |
    def lower_bound(nums, target):
        lo, hi = 0, len(nums)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] < target:
                lo = mid + 1
            else:
                hi = mid
        return lo
