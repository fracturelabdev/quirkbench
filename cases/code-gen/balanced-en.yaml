# code-gen 次元 — 2 つ目のタスク（FLB-QB-001 §17.5）。
# `two-sum` はハッシュ表、こちらはスタック。**同じ解法で解けないものを選ぶ**
id: code-gen-balanced-en
dim: code-gen
lang: en
task: balanced
pair: code-gen-balanced-ja

prompt: |
  Implement the following function in Python. Output nothing but code.

  def is_balanced(text: str) -> bool:
      """Return True if the brackets (), [] and {} in text are correctly
      matched and nested. Ignore every other character."""

options:
  num_predict: 512

failure:
  format: python
  extract: fenced_or_whole
  language: none
  min_tokens: 20

score:
  kind: pytest
  entry_point: is_balanced
  timeout_seconds: 30
  test: |
    def check(candidate):
        assert candidate("({[]})")
        assert not candidate("(]")
        assert not candidate("(()")
  reference: |
    def is_balanced(text):
        pairs = {")": "(", "]": "[", "}": "{"}
        stack = []
        for c in text:
            if c in "([{":
                stack.append(c)
            elif c in pairs:
                if not stack or stack.pop() != pairs[c]:
                    return False
        return not stack
