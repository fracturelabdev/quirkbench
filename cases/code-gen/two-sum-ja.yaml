# code-gen 次元 — 実行採点。日本語版。
# 対訳の en 版と対で ja_penalty を出す（FLB-QB-001 §4）
id: code-gen-two-sum-ja
dim: code-gen
lang: ja
pair: code-gen-two-sum-en

prompt: |
  次の関数を Python で実装してください。コード以外は書かないでください。

  def two_sum(nums: list[int], target: int) -> list[int]:
      """nums の中から和が target になる 2 要素の添字を昇順で返す。
      解は必ず 1 組だけ存在する。同じ要素を 2 回使ってはいけない。"""

options:
  num_predict: 512

failure:
  format: python
  extract: fenced_or_whole   # entry_point を top-level に持つ最後の有効候補（§12.4）
  language: none             # コードは言語判定を適用しない
  min_tokens: 20

score:
  kind: pytest
  entry_point: two_sum
  timeout_seconds: 30        # 非停止の検出だけが目的（§12.5）
  test: |
    def check(candidate):
        assert sorted(candidate([2, 7, 11, 15], 9)) == [0, 1]
        assert sorted(candidate([3, 2, 4], 6)) == [1, 2]
        assert sorted(candidate([3, 3], 6)) == [0, 1]
  reference: |
    def two_sum(nums, target):
        seen = {}
        for i, n in enumerate(nums):
            if target - n in seen:
                return [seen[target - n], i]
            seen[n] = i
        return []
